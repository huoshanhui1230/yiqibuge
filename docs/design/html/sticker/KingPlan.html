<script type="text/x-dc" data-dc-script data-props='{"kingAvatar":{"editor":"enum","options":["鸽子头套","整只变鸽子"],"default":"鸽子头套","section":"鸽子王"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.kingAvatar ?? '鸽子头套';
    const fresh = [false, false, false, false, false];
    const wiped = (this.state && this.state.wiped) || fresh;
    const round = (this.state && this.state.round) || 0;
    const wipe = (i) => () => {
      const next = wiped.slice();
      next[i] = true;
      this.setState({ wiped: next, round: round });
    };
    const count = wiped.filter(Boolean).length;
    return {
      hood: v !== '整只变鸽子',
      full: v === '整只变鸽子',
      s0: !wiped[0], s1: !wiped[1], s2: !wiped[2], s3: !wiped[3], s4: !wiped[4],
      wipe0: wipe(0), wipe1: wipe(1), wipe2: wipe(2), wipe3: wipe(3), wipe4: wipe(4),
      wipedLabel: '已擦 ' + count + '/5',
      allClean: count === 5,
      flyA: round % 2 === 0,
      flyB: round % 2 === 1,
      reset: () => this.setState({ wiped: fresh.slice(), round: round + 1 })
    };
  }
}
</script>
