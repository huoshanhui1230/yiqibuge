<svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true" style="display: block; animation: plop .5s ease-out both; animation-delay: 2.5s"><use href="#splat"></use></svg>
</button>
</sc-if>
<sc-if value="{{ s3 }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="擦掉这坨鸽屎" onClick="{{ wipe3 }}" style="position: absolute; left: 108px; top: 494px; width: 62px; height: 62px; padding: 0; border: 0; background: transparent; cursor: pointer; transform: rotate(22deg)">
<svg width="62" height="62" viewBox="0 0 100 100" aria-hidden="true" style="display: block; animation: plop .5s ease-out both; animation-delay: 1.7s"><use href="#splat"></use></svg>
</button>
</sc-if>
<sc-if value="{{ s4 }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="擦掉这坨鸽屎" onClick="{{ wipe4 }}" style="position: absolute; left: 282px; top: 606px; width: 60px; height: 60px; padding: 0; border: 0; background: transparent; cursor: pointer; transform: rotate(-18deg)">
<svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true" style="display: block; animation: plop .5s ease-out both; animation-delay: 2.7s"><use href="#splat"></use></svg>
</button>
</sc-if>

<sc-if value="{{ allClean }}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(74,50,40,0.38)"></div>
<div role="status" style="position: absolute; left: 40px; right: 40px; top: 300px; box-sizing: border-box; padding: 18px 16px; background: #FFFFFF; border: 3px solid #6B4A3A; border-radius: 26px; box-shadow: 0 5px 0 #F4C2CE; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; animation: pop .4s ease-out both">
<svg width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><use href="#gg"></use></svg>
<div style="font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 24px">擦干净了！</div>
<div style="font-size: 13px; color: #7E5F52">鸽王的局也是局，跟不跟随你</div>
<button type="button" onClick="{{ reset }}" style="margin-top: 4px; height: 40px; padding: 0 18px; border: 2.5px solid #6B4A3A; border-radius: 16px; background: #FFE38F; box-shadow: 0 3px 0 #F0C04E; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 15.5px; font-weight: 400; color: #4A3228; cursor: pointer">再来一坨</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = '鸽子头套';
    const fresh = [false, false, false, false, false];
    const wiped = (this.state && this.state.wiped) || fresh;
    const round = (this.state && this.state.round) || 0;
    const wipe = (i) => () => {
      const next = wiped.slice();
      next[i] = true;
      this.setState({ wiped: next, round: round });
    };
    const count = wiped.filter(Boolean).length;
    return {
      hood: v !== '整只变鸽子',
      full: v === '整只变鸽子',
      s0: !wiped[0], s1: !wiped[1], s2: !wiped[2], s3: !wiped[3], s4: !wiped[4],
      wipe0: wipe(0), wipe1: wipe(1), wipe2: wipe(2), wipe3: wipe(3), wipe4: wipe(4),
      wipedLabel: '已擦 ' + count + '/5',
      allClean: count === 5,
      flyA: round % 2 === 0,
      flyB: round % 2 === 1,
      reset: () => this.setState({ wiped: fresh.slice(), round: round + 1 })
    };
  }
}
</script>
</body>
</html>
